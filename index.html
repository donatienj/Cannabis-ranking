<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie Aléatoire - CRESIDA</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .gallery-container {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }
    img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
    }
    .nav-button {
      position: absolute;
      top: 50%;
      right: -25px;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.3);
      color: white;
      border: none;
      font-size: 2rem;
      width: 50px;
      height: 50px;
      cursor: pointer;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <img id="random-image" src="" alt="Chargement de l'image...">
    <button class="nav-button" id="next-btn">➔</button>
  </div>

  <script>
    let imagesList = [];

    async function initGallery() {
      try {
        const response = await fetch('images.json');
        if (!response.ok) throw new Error("Impossible de charger images.json");
        
        imagesList = await response.json();
        if (imagesList.length > 0) {
          showRandomImage();
        }
      } catch (err) {
        document.getElementById('random-image').alt = "Erreur : " + err.message;
      }
    }

    function showRandomImage() {
      if (imagesList.length === 0) return;
      const randomIndex = Math.floor(Math.random() * imagesList.length);
      document.getElementById('random-image').src = imagesList[randomIndex];
    }

    document.getElementById('next-btn').addEventListener('click', showRandomImage);
    initGallery();
  </script>

</body>
</html>
