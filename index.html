<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie Aléatoire - CRESIDA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .gallery-container {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      right: -20px;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      font-size: 2rem;
      padding: 15px 20px;
      cursor: pointer;
      border-radius: 50%;
      backdrop-filter: blur(5px);
      transition: background-color 0.3s;
    }

    .nav-button:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <img id="random-image" src="" alt="Chargement de l'image...">
    <button class="nav-button" id="next-btn" aria-label="Image suivante">➔</button>
  </div>

  <script>
    // ⚠️ Remplacez 'VOTRE-PSEUDO' et 'NOM-DU-REPO' par vos vraies informations GitHub
    const USERNAME = 'VOTRE-PSEUDO';
    const REPO = 'NOM-DU-REPO';
    const FOLDER_PATH = 'CRESIDA_Selected';

    let imagesList = [];

    // Récupère la liste des fichiers du dossier via l'API GitHub
    async function loadImagesList() {
      const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}`;
      
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        // Filtrer pour ne garder que les fichiers images (.jpg, .png, .webp, etc.)
        imagesList = data
          .filter(file => file.type === 'file' && file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i))
          .map(file => file.path);

        if (imagesList.length > 0) {
          showRandomImage();
        } else {
          document.getElementById('random-image').alt = "Aucune image trouvée dans le dossier.";
        }
      } catch (error) {
        console.error("Erreur lors de la récupération des images:", error);
        document.getElementById('random-image').alt = "Erreur de chargement de la liste d'images.";
      }
    }

    // Affiche une image au hasard parmi la liste
    function showRandomImage() {
      if (imagesList.length === 0) return;
      const randomIndex = Math.floor(Math.random() * imagesList.length);
      const imgElement = document.getElementById('random-image');
      
      // Ajout d'un paramètre anti-cache pour s'assurer que l'image se rafraîchit bien
      imgElement.src = imagesList[randomIndex];
    }

    // Événement sur le bouton flèche
    document.getElementById('next-btn').addEventListener('click', showRandomImage);

    // Démarrage au chargement de la page
    loadImagesList();
  </script>

</body>
</html>
