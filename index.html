<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie & Notation - CRESIDA</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .image-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      object-fit: contain;
    }

    /* Indicateur discret sur l'image */
    .image-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }

    /* Panneau de notation élargi */
    .rating-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      gap: 20px;
    }

    .rating-left {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .rating-title {
      font-size: 0.95rem;
      color: #ccc;
      white-space: nowrap;
    }

    .rating-buttons {
      display: flex;
      gap: 8px;
    }

    .rate-btn {
      width: 42px;
      height: 42px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background: transparent;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .rate-btn:hover {
      border-color: #4CAF50;
      color: #4CAF50;
      transform: translateY(-2px);
    }

    .rate-btn.selected {
      background-color: #4CAF50;
      border-color: #4CAF50;
      color: white;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.5);
    }

    /* Bouton Valider placé à droite */
    .confirm-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
      opacity: 0.4;
      pointer-events: none;
      white-space: nowrap;
    }

    .confirm-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .confirm-btn.active:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    .info-text {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #777;
    }

    /* Écran de fin */
    .end-screen {
      display: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .restart-btn {
      margin-top: 20px;
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background-color: #1e88e5;
    }

    @media (max-width: 768px) {
      .rating-panel {
        flex-direction: column;
        align-items: center;
      }
      .rating-left {
        flex-direction: column;
      }
      .confirm-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="gallery-container" id="main-container">

    <div class="image-wrapper">
      <img id="random-image" src="" alt="Chargement de l'image...">
      <div id="image-badge" class="image-badge">1 / 40</div>
    </div>

    <div class="rating-panel">
      <div class="rating-left">
        <div class="rating-buttons" id="rating-group">
          <button class="rate-btn" data-value="1">1</button>
          <button class="rate-btn" data-value="2">2</button>
          <button class="rate-btn" data-value="3">3</button>
          <button class="rate-btn" data-value="4">4</button>
          <button class="rate-btn" data-value="5">5</button>
          <button class="rate-btn" data-value="6">6</button>
          <button class="rate-btn" data-value="7">7</button>
        </div>
      </div>

      <button class="confirm-btn" id="confirm-btn">Valider & Suivante ➔</button>
    </div>

    <div id="image-name" class="info-text"></div>
  </div>

  <div id="end-screen" class="end-screen">
    <h2>🎉 Session terminée !</h2>
    <p>Vous avez évalué les 40 images de la sélection.</p>
    <button class="restart-btn" onclick="initSession()">Démarrer une nouvelle série de 40 images</button>
  </div>

  <script>
    const MIN_INDEX = 1;
    const MAX_INDEX = 93;
    const SAMPLE_SIZE = 40;
    const FOLDER = "CRESIDA_Selected";
    const EXTENSION = ".jpeg";

    const imgElement = document.getElementById('random-image');
    const badgeElement = document.getElementById('image-badge');
    const nameElement = document.getElementById('image-name');
    const confirmBtn = document.getElementById('confirm-btn');
    const rateButtons = document.querySelectorAll('.rate-btn');
    const mainContainer = document.getElementById('main-container');
    const endScreen = document.getElementById('end-screen');

    let selectedQueue = [];
    let currentIndex = 0;
    let currentImageName = "";
    let selectedRating = null;

    const savedRatings = JSON.parse(localStorage.getItem('cresida_ratings')) || {};

    function generateRandomSelection() {
      const allNumbers = [];
      for (let i = MIN_INDEX; i <= MAX_INDEX; i++) {
        allNumbers.push(i);
      }

      for (let i = allNumbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allNumbers[i], allNumbers[j]] = [allNumbers[j], allNumbers[i]];
      }

      return allNumbers.slice(0, SAMPLE_SIZE);
    }

    function initSession() {
      selectedQueue = generateRandomSelection();
      currentIndex = 0;
      mainContainer.style.display = "flex";
      endScreen.style.display = "none";
      showNextImage();
    }

    rateButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        rateButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedRating = btn.getAttribute('data-value');
        confirmBtn.classList.add('active');
      });
    });

    function resetRatingUI() {
      selectedRating = null;
      rateButtons.forEach(b => b.classList.remove('selected'));
      confirmBtn.classList.remove('active');
    }

    function showNextImage() {
      resetRatingUI();

      if (currentIndex >= selectedQueue.length) {
        mainContainer.style.display = "none";
        endScreen.style.display = "block";
        return;
      }

      const imgNumber = selectedQueue[currentIndex];
      currentImageName = `C${imgNumber}${EXTENSION}`;
      const imagePath = `${FOLDER}/${currentImageName}`;

      badgeElement.textContent = `${currentIndex + 1} / ${selectedQueue.length}`;
      nameElement.textContent = `Fichier : ${currentImageName}`;
      imgElement.src = imagePath;
    }

    confirmBtn.addEventListener('click', () => {
      if (!selectedRating) return;

      savedRatings[currentImageName] = selectedRating;
      localStorage.setItem('cresida_ratings', JSON.stringify(savedRatings));

      currentIndex++;
      showNextImage();
    });

    imgElement.onerror = function() {
      console.warn(`Image ${currentImageName} introuvable. Passage à la suivante.`);
      currentIndex++;
      showNextImage();
    };

    initSession();
  </script>

</body>
</html>
