<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie & Notation - CRESIDA</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Modale d'authentification en superposition avec flou */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(30, 30, 30, 0.85);
      padding: 35px 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      max-width: 400px;
      width: 100%;
    }

    .login-screen h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .login-screen p {
      margin-bottom: 20px;
      color: #ccc;
      font-size: 0.95rem;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #ccc;
    }

    .input-group input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #4CAF50;
    }

    .error-msg {
      color: #ff5252;
      font-size: 0.85rem;
      margin-bottom: 10px;
      min-height: 20px;
      text-align: center;
    }

    .start-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      width: 100%;
    }

    .start-btn:hover {
      transform: scale(1.02);
      background-color: #45a049;
    }

    .gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1100px;
    }

    .image-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
    }

    img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      object-fit: contain;
    }

    .image-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }

    .rating-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      gap: 12px;
    }

    .rating-instruction {
      font-size: 0.95rem;
      color: #e0e0e0;
      font-weight: 500;
    }

    .rating-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }

    .rating-left {
      grid-column: 2;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .rating-buttons {
      display: flex;
      gap: 8px;
    }

    .rate-btn {
      width: 42px;
      height: 42px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background: transparent;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .rate-btn:hover {
      border-color: #4CAF50;
      color: #4CAF50;
      transform: translateY(-2px);
    }

    .rate-btn.selected {
      background-color: #4CAF50;
      border-color: #4CAF50;
      color: white;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.5);
    }

    .confirm-btn {
      grid-column: 3;
      justify-self: end;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
      opacity: 0.4;
      pointer-events: none;
      white-space: nowrap;
    }

    .confirm-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .confirm-btn.active:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    .info-text {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #777;
    }

    .end-screen {
      display: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    @media (max-width: 768px) {
      .rating-row {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .confirm-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Superposition d'authentification -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-screen">
      <h2>Authentification</h2>
      <p>Veuillez entrer votre mot de passe et votre numéro d'anonymat pour commencer.</p>
      
      <div class="input-group">
        <label for="input-password">Mot de passe :</label>
        <input type="password" id="input-password" placeholder="Mot de passe">
      </div>

      <div class="input-group">
        <label for="input-anonymous-id">Numéro d'anonymat :</label>
        <input type="text" id="input-anonymous-id" placeholder="Numéro d'anonymat">
      </div>

      <div id="login-error" class="error-msg"></div>

      <button class="start-btn" onclick="validateLogin()">Commencer l'évaluation</button>
    </div>
  </div>

  <div class="gallery-container" id="main-container">
    <div class="image-wrapper">
      <img id="random-image" src="" alt="Chargement de l'image...">
      <div id="image-badge" class="image-badge">1 / 40</div>
    </div>

    <div class="rating-panel">
      <div class="rating-instruction">À quelle mesure ressentez-vous du craving ?</div>

      <div class="rating-row">
        <div class="rating-left">
          <div class="rating-buttons" id="rating-group">
            <button class="rate-btn" data-value="1">1</button>
            <button class="rate-btn" data-value="2">2</button>
            <button class="rate-btn" data-value="3">3</button>
            <button class="rate-btn" data-value="4">4</button>
            <button class="rate-btn" data-value="5">5</button>
            <button class="rate-btn" data-value="6">6</button>
            <button class="rate-btn" data-value="7">7</button>
          </div>
        </div>

        <button class="confirm-btn" id="confirm-btn">Confirmer ➔</button>
      </div>
    </div>

    <div id="image-name" class="info-text"></div>
  </div>

  <div id="end-screen" class="end-screen">
    <h2>Session terminée</h2>
    <p>Merci pour votre participation</p>
  </div>

<script>
    const MIN_INDEX = 1;
    const MAX_INDEX = 93;
    const SAMPLE_SIZE = 40;
    const FOLDER = "CRESIDA_Selected";
    const EXTENSION = ".jpeg";
    
    const CORRECT_PASSWORD = "Jesuisunedrosophile1";

    //Remplacer par URL du gogole script du gg sheet
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx69o7179tkQ9-BGcilkKWlMIYtz12dLKdz4oSPd7JfZCpowxjudEYw6xiE4cetJqFj/exec";

    const imgElement = document.getElementById('random-image');
    const badgeElement = document.getElementById('image-badge');
    const nameElement = document.getElementById('image-name');
    const confirmBtn = document.getElementById('confirm-btn');
    const rateButtons = document.querySelectorAll('.rate-btn');
    const mainContainer = document.getElementById('main-container');
    const endScreen = document.getElementById('end-screen');

    let selectedQueue = [];
    let currentIndex = 0;
    let currentImageName = "";
    let selectedRating = null;
    let userAnonymousId = "";
    let currentSessionRatings = {}; // Stocke les notes de la session en cours

    function validateLogin() {
      const pwdInput = document.getElementById('input-password').value;
      const anonInput = document.getElementById('input-anonymous-id').value.trim();
      const errorElement = document.getElementById('login-error');

      if (pwdInput !== CORRECT_PASSWORD) {
        errorElement.textContent = "Mot de passe incorrect.";
        return;
      }

      if (!anonInput) {
        errorElement.textContent = "Veuillez saisir votre numéro d'anonymat.";
        return;
      }

      userAnonymousId = anonInput;
      document.getElementById('login-overlay').style.display = "none";
      initSession();
    }

    function generateRandomSelection() {
      const allNumbers = [];
      for (let i = MIN_INDEX; i <= MAX_INDEX; i++) {
        allNumbers.push(i);
      }

      for (let i = allNumbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allNumbers[i], allNumbers[j]] = [allNumbers[j], allNumbers[i]];
      }

      return allNumbers.slice(0, SAMPLE_SIZE);
    }

    function initSession() {
      selectedQueue = generateRandomSelection();
      currentIndex = 0;
      currentSessionRatings = {};
      mainContainer.style.display = "flex";
      endScreen.style.display = "none";
      showNextImage();
    }

    rateButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        rateButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedRating = btn.getAttribute('data-value');
        confirmBtn.classList.add('active');
      });
    });

    function resetRatingUI() {
      selectedRating = null;
      rateButtons.forEach(b => b.classList.remove('selected'));
      confirmBtn.classList.remove('active');
    }

    function showNextImage() {
      resetRatingUI();

      if (currentIndex >= selectedQueue.length) {
        finishSession();
        return;
      }

      const imgNumber = selectedQueue[currentIndex];
      currentImageName = `C${imgNumber}${EXTENSION}`;
      const imagePath = `${FOLDER}/${currentImageName}`;

      badgeElement.textContent = `${currentIndex + 1} / ${selectedQueue.length}`;
      nameElement.textContent = `Fichier : ${currentImageName}`;
      imgElement.src = imagePath;
    }

    confirmBtn.addEventListener('click', () => {
      if (!selectedRating) return;

      // Enregistre la note localement pour la session
      currentSessionRatings[currentImageName] = selectedRating;

      currentIndex++;
      showNextImage();
    });

    // Envoi des données vers Google Sheets à la fin
    async function finishSession() {
      mainContainer.style.display = "none";
      endScreen.innerHTML = "<h2>Envoi des résultats en cours...</h2><p>Veuillez patienter.</p>";
      endScreen.style.display = "block";

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // Nécessaire pour éviter les erreurs CORS Google Script
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId: userAnonymousId,
            ratings: currentSessionRatings
          })
        });

        endScreen.innerHTML = "<h2>Session terminée</h2><p>Vos résultats ont bien été enregistrés dans la base de données. Merci pour votre participation !</p>";
      } catch (error) {
        console.error("Erreur lors de l'envoi :", error);
        endScreen.innerHTML = "<h2>Erreur d'envoi</h2><p>Une erreur est survenue lors de la sauvegarde. Veuillez prévenir l'expérimentateur.</p>";
      }
    }

    imgElement.onerror = function() {
      console.warn(`Image ${currentImageName} introuvable. Passage à la suivante.`);
      currentIndex++;
      showNextImage();
    };
  </script>
  
</body>
</html>
